name: Paper Trade

# 每日自動模擬交易：三盤口袋名單進場 + 棘輪移動停損出場（純門檻，無 LLM）。
#
# 觸發順序（資料齊了才交易）：
#   price-fetch.yml   JST 15:40  收盤價（~10 分）
#   cloud-fetch.yml   JST 17:00  margin + EDINET，分批鏈式跑數小時
#     └ 最後一批完成 → gh workflow run paper-trade.yml   ← 主要觸發點
#   schedule          JST 23:00  死線：這時候還沒跑過就直接跑（不管 margin 鏈跑完沒），
#                                寧可用略舊的 margin 也不要整天沒交易。
#                                （腳本以 JST 日期判斷當日是否已交易，重複觸發無副作用）
"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry run（不寫帳本/不 commit）"
        type: boolean
        default: false
      force:
        description: "當日已交易也強制再跑一次"
        type: boolean
        default: false
      edinet_days:
        description: "EDINET 回補天數（0 = 略過）"
        default: "7"
      report_style:
        description: "日報版型"
        type: choice
        default: image
        options: [image, html, text]
  schedule:
    # UTC 14:00 = JST 23:00 — 死線。正常路徑是 cloud-fetch 全部批次完成後（約 JST 19–20 點）
    # 直接觸發；到這個時間還沒交易過就無條件補跑。
    - cron: "0 14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run auto paper trade
        id: trade
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          INPUT_EDINET_DAYS: ${{ github.event.inputs.edinet_days || '7' }}
        run: |
          ARGS="--materialize"
          [ -n "$INPUT_EDINET_DAYS" ] && [ "$INPUT_EDINET_DAYS" != "0" ] && ARGS="$ARGS --backfill-edinet $INPUT_EDINET_DAYS"
          [ "$INPUT_DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          # cloud-fetch 完成觸發 + JST 23:00 死線排程，同一天可能被觸發兩次 → 已交易就跳過。
          # 死線排程不加 --require-fetch-done：margin 鏈沒跑完也照跑（略舊的籌碼資料 > 沒交易）。
          [ "$INPUT_FORCE" != "true" ] && [ "$INPUT_DRY_RUN" != "true" ] && ARGS="$ARGS --skip-if-logged"
          echo "args: $ARGS"
          python scripts/auto_paper_trade.py $ARGS

      - name: Persist EDINET daily cache to cloud-cache
        if: success() && steps.trade.outputs.paper_trade_skipped != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          # data/cache 是 gitignored（runner 每次全新），EDINET 每日申報要存回 cloud-cache
          # 才能跨 run 累積 60 天窗口（第一盤的輸入）。
          mkdir -p data/cloud-cache/edinet/daily
          if [ -d data/cache/edinet/daily ]; then
            cp -r data/cache/edinet/daily/. data/cloud-cache/edinet/daily/
          fi

      - name: Commit results
        if: success() && steps.trade.outputs.paper_trade_skipped != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledgers/auto-pocket.json \
                  data/auto_trade_log/ \
                  data/scan_snapshots/pocket_*.json \
                  data/cloud-cache/edinet/daily/ || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(paper-trade): $(date -u +%Y-%m-%d) 自動模擬交易"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

      - name: Upload daily log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trade-log-${{ github.run_id }}
          path: data/auto_trade_log/
          if-no-files-found: ignore

      - name: Install CJK font (日報圖用)
        if: success() && steps.trade.outputs.paper_trade_skipped != 'true' && github.event.inputs.dry_run != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Notify Telegram — daily report
        if: success() && steps.trade.outputs.paper_trade_skipped != 'true' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_STYLE: ${{ github.event.inputs.report_style || 'image' }}
        run: |
          # image＝日報圖（sendPhoto）；html＝<pre> 等寬表格；找不到 CJK 字型會自動退回 html
          python scripts/send_daily_report.py --style "$REPORT_STYLE" || true

      - name: Notify Telegram — failure or cancelled
        if: (failure() || cancelled()) && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS="${{ job.status }}"
          MSG="❌ CapyStock 自動模擬交易 ${STATUS}%0Arun: $RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "disable_web_page_preview=true" || true

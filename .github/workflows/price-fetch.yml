name: Price Fetch

# 收盤後（JST 15:30）獨立抓全市場價格 — 與 cloud-fetch（margin 慢速鏈）分開，
# 用 yf.download 批次模式一次跑完，不需 batch chaining。
"on":
  workflow_dispatch:
  schedule:
    # UTC 06:40 = JST 15:40，東證 15:30 收盤後。Actions cron 常延遲 5–30 分，
    # 實際起跑 ~15:45–16:10，仍遠早於本地 price_sync（JST 17:00）。
    - cron: "40 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: price-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run price fetch (bulk)
        run: |
          python scripts/cloud_fetch.py --all --kinds price --price-bulk

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-fetch-report-${{ github.run_id }}
          path: data/cloud-cache/_fetch_report.json
          if-no-files-found: ignore

      - name: Commit price cache
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cloud-cache/*_price.csv data/cloud-cache/_fetch_report.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(price-fetch): update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

      - name: Notify Telegram — done
        if: success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          REPORT="data/cloud-cache/_fetch_report.json"
          if [ -f "$REPORT" ]; then
            OK=$(python -c "import json; print(json.load(open('$REPORT'))['summary'].get('ok',0))")
            FAIL=$(python -c "import json; print(json.load(open('$REPORT'))['summary'].get('fail',0))")
            ELAPSED=$(python -c "import json; print(json.load(open('$REPORT')).get('elapsed_sec',0))")
            MSG="✅ CapyStock 收盤價抓取完成%0Aok=${OK} fail=${FAIL} elapsed=${ELAPSED}s"
          else
            MSG="✅ CapyStock Price Fetch 完成（無 report）"
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" || true

      - name: Notify Telegram — failure or cancelled
        if: (failure() || cancelled()) && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS="${{ job.status }}"
          MSG="❌ CapyStock Price Fetch ${STATUS}%0Arepo: ${{ github.repository }}%0Abranch: ${{ github.ref_name }}%0Arun: $RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "disable_web_page_preview=true" || true

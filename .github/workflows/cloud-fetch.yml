name: Cloud Fetch

# Trigger: manual (Run workflow button) or daily JST 16:00 (UTC 07:00) Mon-Fri
"on":
  workflow_dispatch:
    inputs:
      mode:
        description: "scope: watchlist / all / codes"
        required: false
        default: "watchlist"
        type: choice
        options:
          - watchlist
          - all
          - codes
      codes:
        description: "when mode=codes, comma-separated (e.g. 7203,6758)"
        required: false
        default: ""
      kinds:
        description: "margin / flow / price (comma combo)"
        required: false
        default: "margin,flow,price"
      edinet_days:
        description: "EDINET lookback days (0 = skip)"
        required: false
        default: "3"
      limit:
        description: "max codes to fetch (0 = no limit)"
        required: false
        default: "0"
  schedule:
    - cron: "0 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: cloud-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cloud fetch
        env:
          # schedule event has no inputs -> defaults below kick in
          INPUT_MODE: ${{ github.event.inputs.mode || 'watchlist' }}
          INPUT_CODES: ${{ github.event.inputs.codes }}
          INPUT_KINDS: ${{ github.event.inputs.kinds || 'margin,flow,price' }}
          INPUT_EDINET_DAYS: ${{ github.event.inputs.edinet_days || '3' }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '0' }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          ARGS="--kinds $INPUT_KINDS"
          case "$INPUT_MODE" in
            all)        ARGS="$ARGS --all" ;;
            codes)      [ -n "$INPUT_CODES" ] && ARGS="$ARGS --codes $INPUT_CODES" ;;
            watchlist|*) ARGS="$ARGS --watchlist" ;;
          esac
          [ -n "$INPUT_LIMIT" ] && [ "$INPUT_LIMIT" != "0" ] && ARGS="$ARGS --limit $INPUT_LIMIT"
          [ -n "$INPUT_EDINET_DAYS" ] && [ "$INPUT_EDINET_DAYS" != "0" ] && ARGS="$ARGS --edinet-days $INPUT_EDINET_DAYS"
          echo "Running: python scripts/cloud_fetch.py $ARGS"
          python scripts/cloud_fetch.py $ARGS

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-report-${{ github.run_id }}
          path: data/cloud-cache/_fetch_report.json
          if-no-files-found: ignore

      - name: Commit cloud cache
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cloud-cache/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(cloud-fetch): update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Notify Telegram on failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="❌ CapyStock Cloud Fetch FAILED%0Arepo: ${{ github.repository }}%0Abranch: ${{ github.ref_name }}%0Arun: $RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "disable_web_page_preview=true" || true

      - name: Notify Telegram on success (summary)
        if: success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' && github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          REPORT="data/cloud-cache/_fetch_report.json"
          if [ -f "$REPORT" ]; then
            OK=$(python -c "import json; print(json.load(open('$REPORT'))['summary'].get('ok',0))")
            FAIL=$(python -c "import json; print(json.load(open('$REPORT'))['summary'].get('fail',0))")
            ELAPSED=$(python -c "import json; print(json.load(open('$REPORT')).get('elapsed_sec',0))")
            MSG="✅ Cloud Fetch ok=${OK} fail=${FAIL} elapsed=${ELAPSED}s"
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MSG}" || true
          fi

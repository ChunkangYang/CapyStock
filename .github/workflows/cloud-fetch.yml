name: Cloud Fetch PoC

# Trigger: manual (Run workflow button) or daily JST 16:00 (UTC 07:00)
"on":
  workflow_dispatch:
    inputs:
      codes:
        description: "comma-separated codes (empty = default 5 PoC codes)"
        required: false
        default: ""
      kinds:
        description: "margin / flow / margin,flow"
        required: false
        default: "margin,flow"
      limit:
        description: "max codes to fetch (0 = no limit)"
        required: false
        default: "0"
  schedule:
    - cron: "0 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: cloud-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cloud fetch
        env:
          INPUT_CODES: ${{ github.event.inputs.codes }}
          INPUT_KINDS: ${{ github.event.inputs.kinds }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ARGS=""
          [ -n "$INPUT_CODES" ] && ARGS="$ARGS --codes $INPUT_CODES"
          [ -n "$INPUT_KINDS" ] && ARGS="$ARGS --kinds $INPUT_KINDS"
          [ -n "$INPUT_LIMIT" ] && [ "$INPUT_LIMIT" != "0" ] && ARGS="$ARGS --limit $INPUT_LIMIT"
          python scripts/cloud_fetch.py $ARGS

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-report-${{ github.run_id }}
          path: data/cloud-cache/_fetch_report.json
          if-no-files-found: ignore

      - name: Commit cloud cache
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cloud-cache/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(cloud-fetch): update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

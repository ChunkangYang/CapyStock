name: Paper Trade (Turtle)

# 海龜投資法（Turtle Trading）每日模擬交易 — 與 paper-trade.yml（舊三盤模型）平行、
# 完全獨立：獨立帳本 data/ledgers/auto-turtle.json、獨立 log 目錄
# data/auto_trade_log_turtle/、獨立 commit 範圍。絕對不要修改 paper-trade.yml 本身。
#
# 只依賴日 K（data/cloud-cache/*_price.csv），不需要 EDINET/margin，所以觸發時機
# 比舊模型單純：price-fetch.yml 收盤價同步完成後即可跑，不必等 cloud-fetch 的
# margin/EDINET 分批鏈。
"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry run（不寫帳本/不 commit）"
        type: boolean
        default: false
      force:
        description: "當日已交易也強制再跑一次"
        type: boolean
        default: false
  schedule:
    # UTC 14:30 = JST 23:30 — price-fetch（JST 15:40）之後留充裕時間，
    # 比舊模型的 23:00 死線晚半小時錯開，避免兩個 workflow 同時搶 commit。
    - cron: "30 14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: paper-trade-turtle
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run turtle paper trade
        id: trade
        env:
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS="--materialize"
          [ "$INPUT_DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          [ "$INPUT_FORCE" != "true" ] && [ "$INPUT_DRY_RUN" != "true" ] && ARGS="$ARGS --skip-if-logged"
          echo "args: $ARGS"
          python scripts/run_turtle_trade.py $ARGS

      - name: Commit results
        if: success() && steps.trade.outputs.turtle_trade_skipped != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledgers/auto-turtle.json \
                  data/auto_trade_log_turtle/ || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(paper-trade-turtle): $(date -u +%Y-%m-%d) 海龜投資法模擬交易"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

      - name: Upload daily log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trade-turtle-log-${{ github.run_id }}
          path: data/auto_trade_log_turtle/
          if-no-files-found: ignore

      - name: Notify Telegram — failure or cancelled
        if: (failure() || cancelled()) && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS="${{ job.status }}"
          MSG="❌ CapyStock 海龜投資法模擬交易 ${STATUS}%0Arun: $RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "disable_web_page_preview=true" || true
